<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>보수생각 - 영상 바로보기</title>
    <meta property="og:type" content="video.other">
    <meta property="og:site_name" content="보수생각">
    <meta property="og:title" content="보수생각 - 대한민국 주요 보수 유튜브 모아보기">
    <meta property="og:description" content="터치 한 번으로 보수생각 앱에서 최신 보수 시사 뉴스와 유튜브 영상을 시청하세요!">
    <meta property="og:image" content="https://popo9461.github.io/app_icon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background-color: #0E131F; color: #FFF; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .container { max-width: 480px; width: 100%; background: #171E2E; border-radius: 20px; padding: 28px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); }
        .app-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.4); color: #FF6B6B; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 16px; }
        .title { font-size: 20px; font-weight: 800; line-height: 1.4; color: #F8FAFC; margin-bottom: 20px; word-break: keep-all; }
        .thumb-box { position: relative; width: 100%; padding-top: 56.25%; border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 22px; cursor: pointer; }
        .thumb-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; background: rgba(220, 38, 38, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .play-btn svg { width: 28px; height: 28px; fill: #FFF; margin-left: 4px; }
        .btn-primary { display: block; width: 100%; background: linear-gradient(135deg, #E50914, #B81D24); color: #FFF; text-decoration: none; padding: 16px 20px; border-radius: 12px; font-size: 17px; font-weight: 800; margin-bottom: 12px; border: none; cursor: pointer; }
        .btn-secondary { display: block; width: 100%; background: #252D3F; color: #E2E8F0; text-decoration: none; padding: 13px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .web-fallback { font-size: 13px; color: #94A3B8; text-decoration: underline; cursor: pointer; }
        .guide-text { font-size: 12px; color: #64748B; margin-top: 18px; line-height: 1.5; }
    </style>
</head>
<body>
<div class="container">
    <div class="app-badge"><span>🇰🇷</span> 보수생각 (KNewsTube)</div>
    <h1 class="title" id="video-title">대한민국 주요 보수 유튜브 모아보기</h1>
    <div class="thumb-box" onclick="launchApp()">
        <img id="video-thumb" src="https://popo9461.github.io/app_icon.png" alt="영상 썸네일">
        <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    <button class="btn-primary" onclick="launchApp()">▶ 보수생각 앱에서 영상 바로보기</button>
    <a class="btn-secondary" id="btn-install" href="https://play.google.com/store/apps/details?id=com.popo.knewstube">📲 구글 플레이에서 앱 무료 설치</a>
    <div><a class="web-fallback" id="btn-web" href="https://www.youtube.com">웹(유튜브)에서 바로보기</a></div>
    <p class="guide-text">* 앱이 설치되어 있으면 자동으로 실행됩니다.<br>* 앱이 없으신 경우 구글 플레이 스토어로 이동합니다.</p>
</div>
<script>
    var params = new URLSearchParams(window.location.search);
    var videoId = params.get("v") || params.get("video_id") || "";
    var title = params.get("t") || params.get("title") || "";
    var pkgName = "com.popo.knewstube";
    var playStoreUrl = "https://play.google.com/store/apps/details?id=" + pkgName;
    var youtubeWebUrl = videoId ? "https://www.youtube.com/watch?v=" + videoId : "https://www.youtube.com";

    if (videoId) {
        document.getElementById("video-thumb").src = "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg";
        document.getElementById("btn-web").href = youtubeWebUrl;
    }
    if (title) {
        try { document.getElementById("video-title").innerText = decodeURIComponent(title); } catch(e) {}
    }

    var isAndroid = /Android/i.test(navigator.userAgent);
    var intentUrl = "intent://watch?v=" + encodeURIComponent(videoId) +
        "#Intent;scheme=knewstube;package=" + pkgName +
        ";S.browser_fallback_url=" + encodeURIComponent(playStoreUrl) + ";end;";

    function launchApp() {
        if (isAndroid) {
            window.location.href = intentUrl;
        } else {
            window.location.href = playStoreUrl;
        }
    }

    window.addEventListener("DOMContentLoaded", function() {
        if (isAndroid && videoId) {
            setTimeout(launchApp, 350);
        }
    });
</script>
</body>
</html>
